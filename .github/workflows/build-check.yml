# 提交者检查：有人提 PR 时，先在 Linux 上跑一遍和 Cloudflare 一样的构建。
#
# 为什么需要它：
# Cloudflare 的构建只在 main 上跑（控制台里「Builds for non-production branches」
# 没勾选），所以 PR 分支在合并前完全没人验证。2026-09-24 就吃了这个亏——
# 贡献者把 frontmatter 的 tags 写成两个并列数组：
#     tags: ["传送门多"]  ["风景"]  ["多关"]
# YAML 解析直接报「bad indentation of a mapping entry」，而且就算修好 YAML，
# difficulty: 普通 也不在 schema 允许的枚举里，还会再挂一次。
# 这次错误合并进 main 之后，线上构建红叉，站点没能更新。
# 有了这个 workflow，同样的错误会直接显示在 PR 页面上，合并前就能看到。
#
# 2026-09-24 又补了一条「改错文件」检查：
# 有位贡献者连着提了 3 个 PR，全都直接改 src/content/maps/*.mdx —— 而那是脚本
# 自动生成的，只要有人跑一次 npm run maps:generate 就会被整段覆盖。
# 这种改法**构建照样能过**，所以上面那条检查抓不到，只能专门比一次 diff。
#
# 判定条件刻意收紧成「MDX 变了、但对应的 data/research/<地图名>.json 没变」，
# 这样正常的重新生成（research 与 MDX 一起变）不会被误伤。
#
# 说明：
# - 公开仓库的 Actions 额度免费，这个任务约 1~2 分钟。
# - 跑在 ubuntu 上还有个额外好处：Linux 文件系统大小写敏感，能提前抓出
#   「Windows 本地能过、线上 404」的标签目录/路径大小写问题（踩过一次）。
# - 不部署、不需要任何密钥，只做「构建 + 查站内死链」。
# - Node 用 22（对应 npm 10.x），与 Cloudflare 构建环境保持一致。

name: Build check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          # 下面那步要拿 PR 的 base commit 做 diff，必须完整拉取
          fetch-depth: 0

      - name: 检查有没有改错文件（自动生成的条目）
        if: github.event_name == 'pull_request'
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          if [ -z "$BASE" ]; then
            echo "拿不到 base commit，跳过这项检查"
            exit 0
          fi

          CHANGED=$(git diff --name-only "$BASE" HEAD)

          BAD=$(for f in $(echo "$CHANGED" | grep -E '^src/content/maps/.*\.mdx$' || true); do
            if grep -q "generated by scripts/content/generate-map-entries.mjs" "$f" 2>/dev/null; then
              slug=$(basename "$f" .mdx)
              if ! echo "$CHANGED" | grep -qx "data/research/${slug}.json"; then
                echo "  $f"
              fi
            fi
          done)

          if [ -n "$BAD" ]; then
            echo "::error::修改了「自动生成」的地图条目，却没改对应的资料文件 —— 这些改动会在下次 npm run maps:generate 时被整段覆盖。"
            echo ""
            echo "受影响的文件："
            echo "$BAD"
            echo ""
            echo "正确做法：改 data/research/<地图英文名>.json（原稿）。"
            echo "src/content/maps/*.mdx 是机器从原稿打印出来的成品，手改它等于白改。"
            echo "（如果你确实跑了 npm run maps:generate 重新生成，请把 data/research/ 下的改动一起提交。）"
            exit 1
          fi

          echo "没有改动自动生成的条目 ✅"

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建站点
        run: npm run build

      - name: 检查站内死链
        run: npm run content:links
